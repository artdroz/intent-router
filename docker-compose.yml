services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intent-router-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intent-router
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intent-router"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
