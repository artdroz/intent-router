# Periodic keyword-promotion Job. Runs `node dist/scripts/keyword-promotion.js`
# from the SAME image as the app, against the app DB (app-db-secret).
# Schedule and resources are reasonable guesses.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intent-router-keyword-promotion
spec:
  schedule: "0 0 */1 * *"            # every 1 day
  concurrencyPolicy: Forbid          # never run two promotions at once
  startingDeadlineSeconds: 300       # give up a missed schedule after 5 min
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: keyword-promotion
              image: intent-router:latest
              imagePullPolicy: IfNotPresent   # local: image already loaded into the cluster (kind load)
              command: ["node", "dist/scripts/keyword-promotion.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: app-db-secret
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
