apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intent-router
  template:
    metadata:
      labels:
        app: intent-router
    spec:
      containers:
        - name: app
          image: intent-router:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: DATABASE_URL
            # Non-secret config — fill in your real endpoints/models.
            - name: EMBED_BASE_URL
              value: "http://CHANGE_ME:8000"
            - name: EMBED_MODEL
              value: "CHANGE_ME"
            - name: LLM_BASE_URL
              value: "http://CHANGE_ME:8000"
            - name: LLM_MODEL
              value: "CHANGE_ME"
            # Optional: EMBED_API_KEY / LLM_API_KEY / EMBED_DIMS / MAX_PROMPT_LENGTH
---
apiVersion: v1
kind: Service
metadata:
  name: intent-router
spec:
  selector:
    app: intent-router
  ports:
    - port: 80
      targetPort: 3000
