#
# DATABASE_URL points at the in-cluster postgres Service (k8s/postgres.yaml).
# For real environments, keep this file with placeholders and create secrets
# directly in the cluster instead, e.g.:
#   kubectl create secret generic app-db-secret \
#     --from-literal=DATABASE_URL='postgres://app_user:REAL_PW@db-host:5432/intent-router'
#   kubectl create secret generic migrate-db-secret \
#     --from-literal=DATABASE_URL='postgres://migrate_user:REAL_PW@db-host:5432/intent-router'
#   kubectl create secret generic app-secret \
#     --from-literal=EMBED_API_KEY='REAL_KEY' \
#     --from-literal=LLM_API_KEY='REAL_KEY' \
#     --from-literal=LITELLM_PROXY_TOKEN='REAL_TOKEN'
