# EXAMPLE ONLY — never commit real credentials to git.
#
# Create the real secrets directly in the cluster instead:
#
#   kubectl create secret generic app-db-secret \
#     --from-literal=DATABASE_URL='postgres://app_user:REAL_PW@db-host:5432/intent-router'
#
#   kubectl create secret generic migrate-db-secret \
#     --from-literal=DATABASE_URL='postgres://migrate_user:REAL_PW@db-host:5432/intent-router'
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://app_user:CHANGE_ME@db-host:5432/intent-router"
---
apiVersion: v1
kind: Secret
metadata:
  name: migrate-db-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://migrate_user:CHANGE_ME@db-host:5432/intent-router"
